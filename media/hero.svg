<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="mock-ai-provider wordmark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- vertical accent line -->
  <line x1="120" y1="120" x2="120" y2="480" stroke="#2a2a2a" stroke-width="1"/>

  <!-- small caps eyebrow -->
  <text x="150" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7a7a7a" letter-spacing="6">A LOCAL AI PROVIDER. ON YOUR TERMS.</text>

  <!-- big wordmark -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="800" letter-spacing="-4">
    <text x="150" y="280" font-size="120" fill="#f5f1e8">mock</text>
    <!-- "-ai-" as wireframe to suggest "the simulated part" -->
    <text x="150" y="400" font-size="120" fill="none" stroke="#f5f1e8" stroke-width="2" stroke-dasharray="6 6">-ai-</text>
    <text x="332" y="400" font-size="120" fill="#f5f1e8">provider</text>
  </g>

  <!-- blinking cursor -->
  <rect x="970" y="296" width="14" height="110" fill="#7ee2a8">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom row: tags + command -->
  <g transform="translate(150,470)" font-family="ui-monospace, monospace" font-size="13">
    <g fill="#9a9a9a">
      <rect x="0" y="-18" width="80" height="26" rx="13" fill="none" stroke="#3a3a3a"/>
      <text x="40" y="0" text-anchor="middle">openai</text>
      <rect x="92" y="-18" width="80" height="26" rx="13" fill="none" stroke="#3a3a3a" stroke-dasharray="4 4"/>
      <text x="132" y="0" text-anchor="middle">anthropic</text>
      <rect x="184" y="-18" width="68" height="26" rx="13" fill="none" stroke="#3a3a3a" stroke-dasharray="4 4"/>
      <text x="218" y="0" text-anchor="middle">gemini</text>
      <rect x="264" y="-18" width="34" height="26" rx="13" fill="none" stroke="#3a3a3a" stroke-dasharray="4 4"/>
      <text x="281" y="0" text-anchor="middle">…</text>
    </g>
    <text x="0" y="60" fill="#5a5a5a">$ npx mock-ai-provider serve --providers openai</text>
  </g>

  <!-- corner glyph: a stylized brackets/server mark -->
  <g transform="translate(1040,140)" stroke="#f5f1e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 0 L -24 30 L 0 60"/>
    <path d="M 40 0 L 64 30 L 40 60"/>
    <circle cx="20" cy="30" r="4" fill="#7ee2a8" stroke="none"/>
  </g>
</svg>
